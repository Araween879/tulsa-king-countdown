    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at center, rgba(0,0,0,.08) 0%, rgba(0,0,0,.20) 42%, rgba(0,0,0,.52) 100%);
      pointer-events: none;
    }

    .card {
      width: min(760px, 94vw);
      padding: clamp(24px, 4vw, 48px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 26px 80px rgba(0,0,0,.62);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: .82;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      line-height: .95;
      letter-spacing: .035em;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0,0,0,.8);
    }

    .season {
      display: block;
      margin-top: 12px;
      font-size: clamp(.9rem, 2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    .divider {
      width: min(240px, 60%);
      height: 1px;
      margin: 24px auto 20px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .time-box {
      padding: 18px 8px 14px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(164,44,34,.28), rgba(255,255,255,.025));
    }

    .number {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2rem, 5vw, 3.9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .release {
      margin: 20px 0 0;
      color: #e7e0d5;
      font-size: .82rem;
      line-height: 1.55;
    }

    .release strong {
      color: #fff;
    }

    .finished {
      display: none;
      margin-top: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .card.is-finished .countdown {
      display: none;
    }

    .card.is-finished .finished {
      display: block;
    }

    @media (max-width: 640px) {
      body {
        overflow: auto;
        padding: 14px;
      }

      .card {
        width: min(96vw, 520px);
        padding: 28px 16px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Auf Handys mehr vom Motiv zeigen */
      body::after {
        background-size: auto 100%;
        background-position: 35% center;
      }
    }
  </style>
</head>

<body>
  <div class="shade"></div>

  <main class="card" id="countdownCard">
    <p class="eyebrow">Paramount+ Premiere</p>
    <h1>Tulsa King</h1>
    <span class="season">Staffel 4</span>

    <div class="divider"></div>

    <section class="countdown" aria-label="Countdown bis zum Start von Tulsa King Staffel 4">
      <div class="time-box">
        <span class="number" id="days">10</span>
        <span class="label">Tage</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">15</span>
        <span class="label">Stunden</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">42</span>
        <span class="label">Minuten</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Sekunden</span>
      </div>
    </section>

    <div class="finished">Staffel 4 ist gestartet.</div>

    <p class="release">
      Start: <strong>16. Oktober 2026</strong><br />
      Countdown bis zum Start von Tulsa King Staffel 4.
    </p>
  </main>

  <script>
    const RELEASE_DATE = new Date("2026-10-16T12:02:00+02:00");

    const card = document.getElementById("countdownCard");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    const pad = value => String(value).padStart(2, "0");

    function updateCountdown() {
      const difference = RELEASE_DATE.getTime() - Date.now();

      if (difference <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        card.classList.add("is-finished");
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
